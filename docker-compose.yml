services:
  postgres:
    image: postgres:16-alpine
    container_name: stokkontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockcontrol
      POSTGRES_PASSWORD: stockcontrol
      POSTGRES_DB: stockcontrol
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockcontrol -d stockcontrol"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stokkontrol-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
